[tox]
envlist = py312, unused-code

[testenv]
deps =
    pytest>=8.0
    pydantic>=2.6
commands =
    uv run python -c "import pathlib; root = pathlib.Path('{toxinidir}'); assert not (root / 'py312').exists(), 'worktree root polluted by py312!'; assert (root / '.tox' / 'py312').is_dir(), '.tox/py312 missing!'; print('WORKDIR_ISOLATED_OK')"
    pytest tests/ -v --tb=short

[testenv:unused-code]
deps =
    python-utility-scripts
commands =
    uv run python -c "import pathlib; from apps.utils import all_python_files; root = pathlib.Path('{toxinidir}'); assert not (root / 'unused-code').exists(), 'worktree root polluted by unused-code!'; assert (root / '.tox' / 'unused-code').is_dir(), '.tox/unused-code missing!'; found = [str(p) for p in all_python_files() if 'activate_this.py' in str(p)]; assert not found, f'activate_this.py leaked into scan: {found}'; print('PYUTILS_UNUSEDCODE_WORKTREE_CLEAN')"
